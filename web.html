<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web API Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HTML Profile Card -->
    <div class="card">
        <img src="https://via.placeholder.com/110" alt="Avatar">
        <h2 id="name">${username}</h2>
        <div class="info">Followers: <span id="followers">0</span></div>
        <div class="info">Public Repos: <span id="public_repos">0</span></div>

        <div class="buttons">
            <button id="run">Run</button>
            <button id="stop">Stop</button>
        </div>
    </div>

    <script src="./script.js">


    </script>
</body>

</html>
